<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmação de Avaliação | WDD 131</title>
  <meta name="description" content="Página de confirmação de envio do formulário de avaliação de produto.">
  <meta name="author" content="Edimilson Lima">
  <link rel="preconnect" href="https://fonts.googleapis.com">

      <a href="formulario.html" class="btn-link">Enviar outra avaliação</a>

  </main>
  <footer>
    <p>&copy; <span id="current-year"></span> Edimilson Lima | Brasil</p>
